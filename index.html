    <template id="info-title"><h2>Flurnamen Südtirols<br />I nomi geografici dell'Alto Adige</h2></template>
    <!-- prettier-ignore -->
    <template id="info-content">
      <p>Die Flurnamen-Datenbank des Naturmuseum Südtirol mit ihren inzwischen 185.000 deutschen, italienischen, ladinischen und alpenromanischen Bezeichnungen. Mehr Infos gibt es <a href="https://www.natura.museum/de/digitalesammlungen/flurnamen/" target="_blank">beim Naturmuseum Südtirol</a>.</p>
      <p>Am Projekt gearbeitet haben die Fachleute für Flurnamen Johannes Ortner und Cäcilia Wegscheider, Benno Baumgarten vom Naturmuseum als Projektkoordinator, David Colmano vom Landesamt für Landesplanung und Kartografie, Lydia Flöss der Trentiner Landeskommission für Toponomastik sowie Leander Moroder und Silvia Liotto des ladinischen Kulturinstituts Micurà de Rü.</p>
      <p>Vielen Dank an Martin Meixger und Andreas Baumgartner für die Realisierung dieser Seite.<br />Auszug aus dem Flurnamenkatalog vom <time data-export-date lang="de"></time></p>
      <p>Die Daten können unter der Creative Commons Lizenz CC BY-NC-ND 4.0 genutzt werden, siehe https://creativecommons.org/licenses/by-nc-nd/4.0/deed.de</p>
      <p>La banca dati dei nomi geografici del Museo di Scienze Naturali dell'Alto Adige, che conta ormai 185.000 denominazioni in tedesco, italiano, ladino e romancio alpino. Maggiori informazioni sono disponibili sul sito del Museo di Scienze Naturali dell'Alto Adige.</p>
      <p>Al progetto hanno lavorato gli esperti di toponimi Johannes Ortner e Cäcilia Wegscheider, Benno Baumgarten del Museo di Scienze Naturali come coordinatore del progetto, David Colmano dell'Ufficio Provinciale per la Pianificazione Territoriale e la Cartografia, Lydia Flöss della Commissione Provinciale di Toponomastica del Trentino, nonché Leander Moroder e Silvia Liotto dell'Istituto Culturale Ladino Micurà de Rü.</p>
      <p>Un ringraziamento speciale a Martin Meixger e Andreas Baumgartner per la realizzazione di questo sito.</p>
      <p>Estratto eseguito dal catalogo il <time data-export-date lang="it"></time><br />I dati possono essere utilizzati sotto la licenza CC BY-NC-ND 4.0 https://creativecommons.org/licenses/by-nc-nd/4.0/deed.it</p>
