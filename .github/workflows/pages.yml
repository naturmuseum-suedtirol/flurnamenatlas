name: Pages

on:
  push:
    branches: [main, 'feat/**']
  delete:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'delete' || startsWith(github.event.ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build && mv dist "$RUNNER_TEMP/site"
      - name: Build feat branches
        run: |
          for branch in $(git ls-remote --heads origin 'feat/*' | sed 's|.*refs/heads/||'); do
            echo "::group::$branch"
            git fetch --depth 1 origin "$branch"
            git worktree add --detach "$RUNNER_TEMP/wt" FETCH_HEAD
            if (cd "$RUNNER_TEMP/wt" && npm ci && npm run build); then
              mkdir -p "$RUNNER_TEMP/site/$(dirname "$branch")"
              mv "$RUNNER_TEMP/wt/dist" "$RUNNER_TEMP/site/$branch"
              echo "- [$branch](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$branch/)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Build von $branch fehlgeschlagen"
            fi
            git worktree remove --force "$RUNNER_TEMP/wt"
            echo "::endgroup::"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
